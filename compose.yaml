configs:
  ts-wol-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8080"}}}},  
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":true}}

services:
  ts-wol:
    image: tailscale/tailscale:latest
    container_name: ts-wol
    hostname: ${TS_HOSTNAME}
    environment:
      - TZ=${TZ}
      - TS_AUTHKEY=${TS_AUTHKEY}?ephemeral=false
      - TS_EXTRA_ARGS=--advertise-tags=${TS_TAGS}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
    configs:
      - source: ts-wol-serve
        target: /config/serve.json
    volumes:
      - ts-wol-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      lan:
        ipv4_address: ${CONTAINER_IP}
    restart: unless-stopped 
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  wol:
    build: ./server
    container_name: wol
    depends_on:
      ts-wol:
        condition: service_healthy
    network_mode: service:ts-wol
    environment:
      - TZ=${TZ}
      - WOL_TOKEN=${WOL_TOKEN}
      - WOL_MAC=${WOL_MAC}
      - WOL_BROADCAST=${WOL_BROADCAST}
      - WOL_PORT=${WOL_PORT}
      - WOL_DEBUG=${WOL_DEBUG}
      - WOL_CONN_TIMEOUT=${WOL_CONN_TIMEOUT}
    healthcheck:
      # checks the wol app itself and the ts-wol sidecar it shares the network with
      test: ["CMD", "python3", "/app/test_health.py"]
      interval: 30s
      # test_health.py uses 2 x 5s timeouts worst-case; keep a margin above that
      timeout: 15s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}

volumes:
  ts-wol-state:
