configs:
  ts-wol-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8080"}}}},  
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":true}}

services:
  ts-wol:
    image: tailscale/tailscale:latest
    container_name: ts-wol
    hostname: ${TS_HOSTNAME}
    environment:
      - TZ=${TZ}
      - TS_AUTHKEY=${TS_AUTHKEY}?ephemeral=false
      - TS_EXTRA_ARGS=--advertise-tags=${TS_TAGS}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    configs:
      - source: ts-wol-serve
        target: /config/serve.json
    volumes:
      - ts-wol-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      lan:
        ipv4_address: ${CONTAINER_IP}
    restart: unless-stopped

  wol:
    build: ./server
    container_name: wol
    network_mode: service:ts-wol
    environment:
      - WOL_TOKEN=${WOL_TOKEN}
      - WOL_MAC=${WOL_MAC}
      - WOL_BROADCAST=${WOL_BROADCAST}
      - WOL_DEBUG=${WOL_DEBUG}
    restart: unless-stopped

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}

volumes:
  ts-wol-state:
